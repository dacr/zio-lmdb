<svg width="800" height="240" viewBox="0 0 400 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- ZIO Glowing Core Gradient -->
    <linearGradient id="zGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="zGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="blur1" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- ZIO Brand Blues -->
    <linearGradient id="discGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0055A4" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#0055A4" />
    </linearGradient>
  </defs>

  <!-- Logo Icon -->
  <g transform="translate(10, 10)">
    <!-- 1. BACK HALVES (Darker ZIO Blue) -->
    <g fill="none" stroke="#003366" stroke-width="1.5" opacity="0.8">
      <path d="M 15 25 A 35 12 0 0 1 85 25" />
      <path d="M 15 50 A 35 12 0 0 1 85 50" />
      <path d="M 15 75 A 35 12 0 0 1 85 75" />
    </g>

    <!-- 2. THE LIGHTNING BOLT -->
    <g transform="translate(50, 50) rotate(-45) scale(0.9) translate(-50, -50)">
      <path d="M 65 15 L 35 55 L 55 55 L 35 85 L 65 45 L 45 45 Z" 
            fill="url(#zGrad)" 
            filter="url(#zGlow)" />
    </g>

    <!-- 3. FRONT HALVES (ZIO Blue Gradient) -->
    <g fill="none" stroke="url(#discGrad)" stroke-width="2.5" opacity="0.95">
      <path d="M 15 25 A 35 12 0 0 0 85 25" />
      <path d="M 15 50 A 35 12 0 0 0 85 50" />
      <path d="M 15 75 A 35 12 0 0 0 85 75" />
    </g>
  </g>

  <!-- Text: ZIO-LMDB (Enhanced Tricolor) -->
  <g font-family="system-ui, -apple-system, sans-serif" font-weight="900" stroke="#000000" stroke-width="2.2" paint-order="stroke fill">
    <!-- Main text sized to match baseline width exactly -->
    <text x="115" y="65" font-size="50" letter-spacing="1.2">
      <tspan fill="#0055A4">ZIO</tspan><tspan fill="#FFFFFF" font-size="68" baseline-shift="-2">-</tspan><tspan fill="#EF4135">LMDB</tspan>
    </text>
  </g>
  
  <text x="117" y="92" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="14.5" fill="#475569" letter-spacing="1.2">FAST • EMBEDDABLE • POWERFUL</text>
</svg>
